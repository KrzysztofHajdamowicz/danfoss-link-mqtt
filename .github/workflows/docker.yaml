name: Private OpenSSL image test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t danfoss-link-mqtt:test .
      - name: Native TLS regressions (synthetic certificates only)
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,size=32m,mode=1777
          -e PYTHONPATH=/app:/app/tests
          danfoss-link-mqtt:test
          python -m unittest test_native_tls test_pace_crypto test_mqtt_status
