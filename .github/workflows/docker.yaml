name: Build, test and publish image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Protocol and synthetic MQTT broker tests
        env:
          PYTHONPATH: src:tests
        run: >-
          python -m unittest test_mqtt_bridge test_mqtt_status test_mqtt_wire
          test_temperature_control test_readonly_transport test_pace_crypto
          test_identity_profile test_code_diagnostics test_rooms
  image:
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build once and load the exact image to test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: danfoss-link-mqtt:tested
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Native TLS and status regressions inside the built image
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,size=32m,mode=1777
          -e PYTHONPATH=/app:/app/tests
          danfoss-link-mqtt:tested
          python -m unittest test_native_tls test_pace_crypto test_mqtt_status
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image that passed tests
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag danfoss-link-mqtt:tested "$IMAGE:sha-$GITHUB_SHA"
          docker tag danfoss-link-mqtt:tested "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:sha-$GITHUB_SHA and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
