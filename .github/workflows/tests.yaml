name: Tests
on:
  # Pull requests are already tested by their pull_request run.
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Keep in step with the uv image in the Dockerfile.
          version: "0.13.1"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Protocol, hub, add-on and synthetic MQTT broker tests
        env:
          PYTHONPATH: src:tests
        run: >-
          uv run --locked python -m unittest test_mqtt_bridge test_mqtt_status
          test_mqtt_wire test_temperature_control test_readonly_transport
          test_pace_crypto test_identity_profile test_code_diagnostics test_rooms
          test_hub_transport test_hub_model test_hub_client test_hub_bridge
          test_hub_wire test_addon_run test_pairing_code test_release_metadata test_sbom_openssl
