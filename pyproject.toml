[project]
name = "danfoss-link-mqtt"
version = "0.1.0"
description = "Danfoss Link CC to Home Assistant over MQTT, through the Danfoss cloud relay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["paho-mqtt==2.1.0"]

[dependency-groups]
dev = ["amqtt==0.11.3"]

[tool.uv]
# Scripts under src/ run directly; there is no installable package.
package = false
